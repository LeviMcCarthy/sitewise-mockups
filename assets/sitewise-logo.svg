<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;400');
    </style>
  </defs>

  <!-- Icon: Abstract rising bars forming a subtle "S" shape / growth chart -->
  <g transform="translate(40, 30)">
    <!-- Bar 1 - shortest -->
    <rect x="0" y="100" width="18" height="40" rx="4" fill="#2563EB" opacity="0.4"/>
    <!-- Bar 2 -->
    <rect x="24" y="75" width="18" height="65" rx="4" fill="#2563EB" opacity="0.6"/>
    <!-- Bar 3 -->
    <rect x="48" y="45" width="18" height="95" rx="4" fill="#2563EB" opacity="0.8"/>
    <!-- Bar 4 - tallest -->
    <rect x="72" y="15" width="18" height="125" rx="4" fill="#2563EB"/>
    <!-- Upward arrow / cursor accent -->
    <polygon points="81,8 75,20 87,20" fill="#2563EB"/>
  </g>

  <!-- SiteWise text -->
  <text x="155" y="115" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="56" fill="#1E293B" letter-spacing="-1">
    <tspan fill="#2563EB">Site</tspan><tspan fill="#1E293B">Wise</tspan>
  </text>

  <!-- Agency text -->
  <text x="158" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#64748B" letter-spacing="5">AGENCY</text>
</svg>